# Development override – use together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# - Django runs with the auto-reloading dev server and mounted source code
# - React runs in the Vite dev server with hot module replacement
# - nginx serves plain HTTP on http://localhost:8080 (no certificates needed)
# - certbot is disabled

services:
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  backend:
    build:
      args:
        INSTALL_DEV: "true"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECURE_COOKIES: "false"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - django_static:/app/staticfiles

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
      VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"

  nginx:
    # Stock image instead of the production build (which bundles the frontend).
    image: nginx:stable-alpine
    build: !reset null
    environment:
      DOMAIN: localhost
    ports: !override
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/templates-dev:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - backend
      - frontend

  certbot:
    profiles: ["production-only"]

volumes:
  frontend_node_modules:
